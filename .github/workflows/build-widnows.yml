name: Build Windows EXE

on:
  # Umožní spustit build ručně přes GitHub Actions
  workflow_dispatch:

  # Automatický build při vytvoření tagu např. v1.0.0
  push:
    tags:
      - "v*"

# Potřeba pro vytvoření GitHub Release
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Windows EXE
        run: |
          pyinstaller --onefile --name Vazenky main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Vazenky-Windows
          path: dist/Vazenky.exe
          if-no-files-found: error

      # Zip kvůli prohlížečům/SmartScreen, které blokují stažení samotného .exe
      - name: Generate third-party licenses
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python scripts/third_party_licenses.py dist/THIRD_PARTY_LICENSES.txt

      - name: Create ZIP
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          Compress-Archive -Path dist/Vazenky.exe, dist/THIRD_PARTY_LICENSES.txt, LICENSE -DestinationPath dist/Vazenky-Windows.zip

      # Release jen pro tagy v*; asset je ve veřejném repu ke stažení bez přihlášení
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Vazenky.exe
            dist/Vazenky-Windows.zip
          fail_on_unmatched_files: true
          generate_release_notes: true