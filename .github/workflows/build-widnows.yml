name: Build Windows EXE

on:
  # Umožní spustit build ručně přes GitHub Actions
  workflow_dispatch:

  # Automatický build při vytvoření tagu např. v1.0.0
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Windows EXE
        run: |
          pyinstaller --onefile --name Vazenky vazenky.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Vazenky-Windows
          path: dist/Vazenky.exe
          if-no-files-found: error